# Nemotron Reasoning Budgets & Effort Mappings
# Per-model max reasoning budgets and effort presets
# Supports shell-style glob patterns for model families (e.g., "deepseek-*", "nvidia/nemotron-3-*")
#
# Effort levels (Claude-style):
#   ultracode, max, high, xhigh → top thinking, model's max budget
#   medium → medium thinking, half of max budget
#   low → low thinking, ~2048 tokens
#   (effort 'max' is alias for 'high')

models:
  "nvidia/nemotron-3-ultra-550b-a55b":      # 500B param
    max_reasoning_budget: 32768
    supports_thinking: true
    effort_mapping:
      max: high
      high: high
      xhigh: high
      medium: medium
      low: medium      # 500B doesn't support low_effort, map to medium
      ultracode: high
    budget_per_effort:
      max: 32768
      high: 32768
      xhigh: 32768
      medium: 16384
      low: 2048
      ultracode: 32768

  "nvidia/nemotron-3-super-120b-a12b":      # 120B param
    max_reasoning_budget: 32768
    supports_thinking: true
    effort_mapping:
      max: high
      high: high
      xhigh: high
      medium: high
      low: low
      ultracode: high
    budget_per_effort:
      max: 32768
      high: 32768
      xhigh: 32768
      medium: 16384
      low: 2048
      ultracode: 32768

  "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning":  # 30B MoE
    max_reasoning_budget: 16384
    supports_thinking: true
    effort_mapping:
      max: high
      high: high
      xhigh: high
      medium: medium
      low: low
      ultracode: high
    budget_per_effort:
      max: 16384
      high: 16384
      xhigh: 16384
      medium: 8192
      low: 2048
      ultracode: 16384

  "nvidia/nemotron-3-*":                      # Nemotron 3 family glob
    max_reasoning_budget: 32768
    supports_thinking: true
    effort_mapping:
      max: high
      high: high
      xhigh: high
      medium: medium
      low: low
      ultracode: high
    budget_per_effort:
      max: 32768
      high: 32768
      xhigh: 32768
      medium: 16384
      low: 2048
      ultracode: 32768

  "deepseek-*":
    max_reasoning_budget: 32768
    supports_thinking: true
    effort_mapping:
      max: high
      high: high
      xhigh: high
      medium: medium
      low: low
      ultracode: high
    budget_per_effort:
      max: 32768
      high: 32768
      xhigh: 32768
      medium: 16384
      low: 2048
      ultracode: 32768

defaults:
  max_reasoning_budget: 32768
  supports_thinking: false
  effort_mapping:
    max: high
    high: high
    xhigh: high
    medium: medium
    low: low
    ultracode: high
  budget_per_effort:
    max: 32768
    high: 32768
    xhigh: 32768
    medium: 16384
    low: 2048
    ultracode: 32768